<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#004C9C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="لوحة اليابان">
<title>لوحة منتجات اليابان</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style id="sty">:root{--ground:#F4F6FA;--card:#FFFFFF;--sunk:#EDF1F7;--ink:#0E1520;--dim:#5A6577;--faint:#8A93A3;--line:#DCE3ED;
 --brand:#004C9C;--brand-soft:#E7EFF9;--accent:#FF5200;--accent-soft:#FFF0E8;--ok:#0F6B45;--ok-soft:#E6F4EC;
 --warn:#9A3412;--warn-soft:#FFF1E6;--shadow:0 1px 2px rgba(14,21,32,.05),0 8px 24px -12px rgba(14,21,32,.12)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#0C1017;--card:#141A23;--sunk:#1B222C;
 --ink:#E7ECF4;--dim:#98A3B4;--faint:#6C7787;--line:#242C38;--brand:#79ADEF;--brand-soft:#132234;--accent:#FF7A42;
 --accent-soft:#2A180F;--ok:#59D69B;--ok-soft:#0E2A1E;--warn:#FFA366;--warn-soft:#33190C;
 --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--ground:#0C1017;--card:#141A23;--sunk:#1B222C;--ink:#E7ECF4;--dim:#98A3B4;--faint:#6C7787;
 --line:#242C38;--brand:#79ADEF;--brand-soft:#132234;--accent:#FF7A42;--accent-soft:#2A180F;--ok:#59D69B;--ok-soft:#0E2A1E;
 --warn:#FFA366;--warn-soft:#33190C;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6)}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);direction:rtl;
 font:400 15px/1.6 "IBM Plex Sans Arabic",-apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1140px;margin:0 auto;padding:28px 18px 90px}
header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:0 0 8px}
h1{font-size:clamp(21px,3vw,27px);font-weight:700;letter-spacing:-.5px;margin:0;flex:1;min-width:200px}
nav{display:flex;gap:6px;background:var(--sunk);padding:4px;border-radius:11px}
.tab{font:inherit;font-size:13.5px;font-weight:600;border:0;background:transparent;color:var(--dim);
 padding:7px 15px;border-radius:8px;cursor:pointer}
.tab.on{background:var(--card);color:var(--brand);box-shadow:var(--shadow)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lede{color:var(--dim);margin:0 0 22px;max-width:66ch;font-size:14px}
.sum{display:flex;gap:22px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;
 padding:14px 18px;box-shadow:var(--shadow);margin:0 0 18px}
.sum div{display:flex;flex-direction:column;line-height:1.25}
.sum b{font-size:20px;font-weight:600;color:var(--brand);font-family:"IBM Plex Mono",monospace}
.sum span{font-size:11.5px;color:var(--faint)}
.filters{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:0 0 16px}
.filters .lbl{font-size:11.5px;color:var(--faint);margin-inline-start:8px}
.q{font:inherit;font-size:13.5px;padding:8px 13px;border:1px solid var(--line);border-radius:9px;
 background:var(--card);color:var(--ink);min-width:250px;flex:1}
.q:focus{outline:2px solid var(--brand);outline-offset:1px}
button{font:inherit;font-size:13px;font-weight:500;border-radius:9px;border:1px solid var(--line);
 background:var(--card);color:var(--ink);padding:7px 13px;cursor:pointer}
button:hover{background:var(--sunk)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}
button.go{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
button.go[disabled]{opacity:.45;cursor:default}
.list{display:flex;flex-direction:column;gap:10px}
.p{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.p.pend{border-color:var(--accent)}
.ph{display:flex;gap:14px;align-items:center;padding:13px 16px;cursor:pointer;flex-wrap:wrap}
.ph:hover{background:var(--sunk)}
.pt{flex:1;min-width:190px}
.pt h3{margin:0;font-size:15.5px;font-weight:600}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--dim)}
.chip.code{font-family:"IBM Plex Mono",monospace}
.chip.salla{background:var(--ok-soft);color:var(--ok)}
.chip.new{background:var(--sunk);color:var(--faint)}
.chip.pending{background:var(--accent-soft);color:var(--accent)}
.pm{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--dim);white-space:nowrap}
.pm b{font-family:"IBM Plex Mono",monospace;font-size:16px;color:var(--brand);font-weight:600}
.pm b.warn{color:var(--warn)}
.caret{color:var(--faint);font-size:11px}
.pb{border-top:1px solid var(--line);background:var(--sunk);padding:13px 16px;display:flex;flex-direction:column;gap:12px}
.cblk{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.chd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:9px}
.chd>b{font-family:"IBM Plex Mono",monospace;font-size:14px}
.cn{font-size:12px;color:var(--dim)}
.cs{font-size:11.5px;color:var(--dim)}
.cp{font-size:12px;font-weight:600;color:var(--brand);margin-inline-start:auto}
.cp.warn{color:var(--warn)}
.cst{font-size:11px;color:var(--faint)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:9px}
.tw table{border-collapse:collapse;width:100%;min-width:max-content;font-size:11.5px}
.tw th,.tw td{border-inline-start:1px solid var(--line);padding:5px 9px;text-align:center;white-space:nowrap;vertical-align:top}
.tw tr>*:first-child{border-inline-start:0;text-align:start;background:var(--sunk);color:var(--faint);
 font-size:10.5px;font-weight:500;position:sticky;inset-inline-start:0}
.tw thead th{background:var(--sunk);font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--faint)}
.tw thead th.in{color:var(--ok)}
.tw td.in{background:var(--ok-soft)}
.tw td span,.tw td a{display:block}
.tw td a{font-size:11px;font-weight:600;color:var(--brand);text-decoration:none}
.tw td a:hover{text-decoration:underline}
.tw td .s{font-size:11px;font-weight:600}
.tw td .y{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--dim)}
.tw td .r{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--faint)}
details{margin-top:8px;font-size:11.5px;color:var(--dim)}
summary{cursor:pointer;color:var(--faint);font-size:11px}
details ul{margin:5px 0 0;padding-inline-start:17px;line-height:1.85}
details b{font-family:"IBM Plex Mono",monospace;color:var(--ink)}
details a{color:var(--brand)}
.no{color:var(--accent)}
.none{color:var(--warn);font-size:12px;margin:4px 0}
.note2{font-size:12px;color:var(--dim);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin:0}
.addwrap{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow);max-width:760px}
.addwrap h2{margin:0 0 6px;font-size:18px;font-weight:600}
.hint{font-size:13px;color:var(--dim);margin:0 0 18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:12px}
.f{display:flex;flex-direction:column;gap:5px}
.f>span{font-size:12px;color:var(--dim);font-weight:500}
.f input,.f textarea{font:inherit;font-size:13.5px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;
 background:var(--sunk);color:var(--ink);width:100%;resize:vertical}
.f input:focus,.f textarea:focus{outline:2px solid var(--brand);outline-offset:1px}
.acts{display:flex;gap:8px;margin-top:14px}
.note{font-size:12.5px;margin:12px 0 0}
.note.ok{color:var(--ok)}
.note.err{color:var(--accent)}
.addedh{font-size:14px;font-weight:600;margin:22px 0 8px}
.addedl{margin:0;padding-inline-start:18px;font-size:12.5px;color:var(--dim);line-height:1.9}
.addedl b{font-family:"IBM Plex Mono",monospace;color:var(--ink)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:600px){.pm{width:100%;justify-content:space-between}}

.ml{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--warn-soft);color:var(--warn)}

.lvl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 9px}
.lvll{font-size:10.5px;color:var(--faint)}
.lv{display:inline-flex;align-items:baseline;gap:6px;font-size:11px;padding:3px 8px;border-radius:7px;
 background:var(--sunk);color:var(--dim);text-decoration:none;border:1px solid transparent}
a.lv:hover{border-color:var(--line)}
.lv b{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink)}
.lv .ln{font-weight:600}
.lv .lr{font-family:"IBM Plex Mono",monospace;opacity:.75}
.lv .lnote{font-size:10px;opacity:.6}
.tw td a.src-amazon{color:var(--accent)}

/* شارة المصدر داخل الخلية */
.stag{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:5px;margin-bottom:2px;letter-spacing:.2px}
.stag-rakuten{background:var(--brand-soft);color:var(--brand)}
.stag-amazon{background:var(--accent-soft);color:var(--accent)}
/* مفتاح القراءة */
.legend{display:flex;flex-direction:column;gap:5px;background:var(--card);border:1px solid var(--line);
 border-radius:12px;padding:12px 15px;margin:0 0 16px;font-size:12px;color:var(--dim);box-shadow:var(--shadow)}
.legend>b{font-size:12.5px;color:var(--ink);margin-bottom:2px}
.legend span{display:flex;align-items:baseline;gap:7px}
.legend b{color:var(--ink)}
.lg{width:11px;height:11px;border-radius:3px;flex:none;display:inline-block;transform:translateY(1px)}
.lg.in{background:var(--ok-soft);border:1px solid var(--ok)}
.lg.tagr{background:var(--brand-soft);border:1px solid var(--brand)}
.lg.taga{background:var(--accent-soft);border:1px solid var(--accent)}
.lg.ml{background:var(--warn-soft);border:1px solid var(--warn)}

.azrow th{color:var(--accent)!important}
.azrow td a{color:var(--accent);font-family:"IBM Plex Mono",monospace;font-size:11px}
.azrow td .dash{color:var(--line)}

.tw td.over{background:var(--warn-soft)}
.tw td .ov{font-size:9.5px;font-weight:700;color:var(--warn)}
.lg.over{background:var(--warn-soft);border:1px solid var(--warn)}

.storelink{font-size:13px;font-weight:600;color:var(--brand);text-decoration:none;background:var(--brand-soft);
 padding:7px 14px;border-radius:9px;white-space:nowrap}
.storelink:hover{filter:brightness(1.05)}
.plinks{display:flex;gap:14px;flex-wrap:wrap;margin:0;font-size:12.5px}
.plinks a{color:var(--brand);font-weight:600;text-decoration:none}
.plinks a:hover{text-decoration:underline}

.more{margin:14px 0 0;font-size:12.5px}
.more>summary{color:var(--brand);font-size:12.5px;font-weight:600;margin-bottom:10px}
.addwrap .f textarea{min-height:78px;font-family:"IBM Plex Mono","IBM Plex Sans Arabic",monospace;font-size:13px;direction:ltr;text-align:left}

/* بوّابة الدخول */
.gate{min-height:100dvh;display:grid;place-items:center;padding:24px}
.gbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 24px;box-shadow:var(--shadow);width:100%;max-width:380px;text-align:center}
.gbox h1{font-size:20px;margin:0 0 6px}
.gbox p{color:var(--dim);font-size:13px;margin:0 0 18px}
.gbox input{font:inherit;font-size:16px;width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);color:var(--ink);text-align:center;direction:ltr}
.gbox input:focus{outline:2px solid var(--brand);outline-offset:1px}
.gbox button{width:100%;margin-top:12px;background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;font-size:15px;padding:11px}
.gerr{color:var(--accent);font-size:12.5px;margin-top:10px;min-height:18px}
.gremember{display:flex;align-items:center;gap:7px;justify-content:center;margin-top:12px;font-size:12.5px;color:var(--dim)}
</style></head><body>
<div id="gate" class="gate"><div class="gbox">
  <h1>لوحة منتجات اليابان</h1><p>هذه الصفحة تحوي تكاليفك وهوامشك — أدخل كلمة المرور لفتحها.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="كلمة المرور" enterkeyhint="go">
  <label class="gremember"><input id="rem" type="checkbox" checked style="width:auto"> تذكّرني على هذا الجهاز</label>
  <button id="go">افتح</button><div id="gerr" class="gerr"></div>
</div></div>

<script>
(function () {
  var B = JSON.parse(document.getElementById('blob').textContent);
  var b64 = function (s) { var r = atob(s), u = new Uint8Array(r.length); for (var i = 0; i < r.length; i++) u[i] = r.charCodeAt(i); return u; };
  async function unlock(pass) {
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(B.s), iterations: B.n, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var ctTag = new Uint8Array(b64(B.c).length + b64(B.t).length);
    ctTag.set(b64(B.c)); ctTag.set(b64(B.t), b64(B.c).length);
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(B.i) }, key, ctTag);
    var ds = new DecompressionStream('gzip');
    var txt = await new Response(new Blob([plain]).stream().pipeThrough(ds)).text();
    return txt;
  }
  function boot(json) {
    var s = document.createElement('script');
    s.id = 'data'; s.type = 'application/json'; s.textContent = json;
    document.body.appendChild(s);
    document.getElementById('gate').remove();
    var a = document.createElement('script'); a.id = 'app'; a.textContent = APP_SRC;
    document.body.appendChild(a);
  }
  var go = document.getElementById('go'), pw = document.getElementById('pw'), err = document.getElementById('gerr');
  async function attempt(p, quiet) {
    try { var j = await unlock(p); if (document.getElementById('rem').checked) localStorage.setItem('rs_pw', p); boot(j); }
    catch (e) { if (!quiet) { err.textContent = 'كلمة المرور غير صحيحة'; pw.select(); } localStorage.removeItem('rs_pw'); }
  }
  go.onclick = function () { err.textContent = ''; attempt(pw.value, false); };
  pw.onkeydown = function (e) { if (e.key === 'Enter') go.click(); };
  var saved = localStorage.getItem('rs_pw');
  if (saved) attempt(saved, true); else pw.focus();
})();
</script>
<script>var APP_SRC = "(function () {\n  var DATA = JSON.parse(document.getElementById('data').textContent);\n  var ADDED = JSON.parse(localStorage.getItem('rs_added') || '[]');\n  var root = document.getElementById('root');\n  var view = 'list';\n  var F = { q: '', brand: 'all', cat: 'all', src: 'all' };\n  var open = {};\n  var msg = null, saving = false, artifact = null;\n  var form = { input: '', brand: '', colors: '', salla: '', note: '' };\n\n  var esc = function (s) {\n    return String(s == null ? '' : s).replace(/[&<>\"]/g, function (c) {\n      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' })[c];\n    });\n  };\n  var all = function () { return DATA.products.concat(ADDED); };\n  // المقاس «مقبول» إذا كان سعره ضمن نطاق سعر المنتج — يُحسب في البناء ويصل كـ ok\n  var inL = function (z) { return +z >= 25.5 && +z <= 29.0; };\n  var okOf = function (s) { return s && s.ok !== undefined ? s.ok : inL(s && s.size); };\n\n  function okSizes() {\n    return all().reduce(function (a, p) {\n      return a + (p.colors || []).reduce(function (b, c) { return b + (c.perSize || []).filter(okOf).length; }, 0); }, 0);\n  }\n\n  function srcCount() {\n    var s = {};\n    all().forEach(function (p) { (p.colors || []).forEach(function (c) {\n      (c.perSize || []).forEach(function (x) { s[x.src || 'rakuten'] = 1; });\n      (c.level || []).forEach(function (x) { s[x.src] = 1; });\n    }); });\n    return Object.keys(s).length;\n  }\n\n  function visible() {\n    var q = F.q.trim().toLowerCase();\n    return all().filter(function (p) {\n      if (F.brand !== 'all' && p.brand !== F.brand) return false;\n      if (F.cat !== 'all' && p.cat !== F.cat) return false;\n      if (q && (p.name + ' ' + p.code + ' ' + (p.salla || '') + ' ' + p.brand).toLowerCase().indexOf(q) < 0) return false;\n      if (F.src !== 'all') {\n        var has = (p.colors || []).some(function (c) {\n          return (c.perSize || []).some(function (x) { return (x.src || 'rakuten') === F.src; }) ||\n                 (c.level || []).some(function (x) { return x.src === F.src; });\n        });\n        if (!has) return false;\n      }\n      return true;\n    });\n  }\n\n  function sizeTable(c) {\n    // صفّ «أرخص مصدر» + صفّ أمازون المستقل حين توجد بياناته\n    if (!c.perSize || !c.perSize.length) return '<p class=\"none\">لا مقاس متوفر عند أي متجر موثّق الآن</p>';\n    return '<div class=\"tw\"><table><thead><tr><th>المقاس</th>' +\n      c.perSize.map(function (s) { return '<th class=\"' + (okOf(s) ? 'in' : '') + '\">' + s.size + '</th>'; }).join('') +\n      '</tr></thead><tbody><tr><th>أرخص مصدر</th>' +\n      c.perSize.map(function (s) {\n        return '<td class=\"' + (okOf(s) ? 'in' : 'over') + '\"' + (okOf(s) ? '' : ' title=\"أغلى من أرخص مقاس بـ' + s.over + '٪\"') + '>' +\n          '<span class=\"stag stag-' + esc(s.src || 'rakuten') + '\">' + esc(DATA.srcLabels[s.src] || 'راكوتين') + '</span>' +\n          (s.url ? '<a href=\"' + esc(s.url) + '\" target=\"_blank\" rel=\"noopener\">' + esc(s.shop) + ' ↗</a>'\n                 : '<span class=\"s\">' + esc(s.shop) + '</span>') +\n          '<span class=\"y\">¥' + s.jpy + '</span><span class=\"r\">' + s.sar + ' ر.س</span>' +\n          (okOf(s) ? '' : '<span class=\"ov\">+' + s.over + '٪</span>') + '</td>';\n      }).join('') + '</tr>' +\n      ((c.azSize && Object.keys(c.azSize).length)\n        ? '<tr class=\"azrow\"><th>أمازون اليابان</th>' + c.perSize.map(function (s) {\n            var z = c.azSize[s.size];\n            return '<td class=\"' + (okOf(s) ? 'in' : 'over') + '\">' + (z\n              ? '<a href=\"' + esc(z.url) + '\" target=\"_blank\" rel=\"noopener\">¥' + z.jpy + ' ↗</a><span class=\"r\">' + z.sar + ' ر.س</span>'\n              : '<span class=\"dash\">—</span>') + '</td>';\n          }).join('') + '</tr>'\n        : '') +\n      '</tbody></table></div>';\n  }\n\n  function colorBlock(p, c) {\n    var n = (c.perSize || []).length, nl = (c.perSize || []).filter(okOf).length;\n    var lo = (c.perSize || []).length ? Math.min.apply(null, c.perSize.map(function (s) { return s.sar; })) : null;\n    return '<div class=\"cblk\"><div class=\"chd\"><b>' + esc(c.col || '—') + '</b>' +\n      (c.name ? '<span class=\"cn\">' + esc(c.name) + '</span>' : '') +\n      '<span class=\"cs\">' + n + ' مقاساً · <b>' + nl + '</b> بسعر مقبول</span>' +\n      (c.modelLevel ? '<span class=\"ml\" title=\"المتاجر لا تذكر رمز اللون؛ المصدر مؤكَّد للموديل لا للون\">مصدر على مستوى الموديل</span>' : '') +\n      (lo ? '<span class=\"cp\">من ' + lo + ' ر.س</span>' : '<span class=\"cp warn\">بلا مصدر</span>') +\n      (c.store ? '<span class=\"cst\">سعر المتجر ' + c.store + '</span>' : '') +\n      '</div>' +\n      ((c.level && c.level.length) ? '<div class=\"lvl\"><span class=\"lvll\">على مستوى اللون</span>' +\n        c.level.sort(function (a, b) { return a.jpy - b.jpy; }).map(function (o) {\n          var inner = '<span class=\"ln\">' + esc(o.label) + '</span><b>¥' + o.jpy + '</b><span class=\"lr\">' + o.sar + ' ر.س</span>' +\n            (o.note ? '<span class=\"lnote\">' + esc(o.note) + '</span>' : '');\n          return o.url ? '<a class=\"lv\" href=\"' + esc(o.url) + '\" target=\"_blank\" rel=\"noopener\">' + inner + ' ↗</a>'\n                       : '<span class=\"lv\">' + inner + '</span>';\n        }).join('') + '</div>' : '') +\n      sizeTable(c) +\n      ((c.shops && c.shops.length) ? '<details><summary>متاجر هذا اللون (' + c.shops.length + ')</summary><ul>' +\n        c.shops.map(function (s) {\n          return '<li><b>¥' + s.jpy + '</b> · ' + esc(s.shop) + ' · ' +\n            (s.sizes.length ? s.sizes.join(' ') : '<span class=\"no\">نافد</span>') +\n            (s.url ? ' · <a href=\"' + esc(s.url) + '\" target=\"_blank\" rel=\"noopener\">فتح ↗</a>' : '') + '</li>';\n        }).join('') + '</ul></details>' : '') + '</div>';\n  }\n\n  function productCard(p) {\n    var isOpen = !!open[p.id];\n    var cols = p.colors || [];\n    var sizes = cols.reduce(function (a, c) { return a + ((c.perSize || []).length); }, 0);\n    var lo = cols.flatMap(function (c) { return (c.perSize || []).map(function (s) { return s.sar; }); });\n    return '<article class=\"p' + (p.pending ? ' pend' : '') + '\">' +\n      '<div class=\"ph\" data-open=\"' + p.id + '\">' +\n        '<div class=\"pt\"><h3>' + esc(p.name || p.code) + '</h3>' +\n          '<div class=\"chips\"><span class=\"chip\">' + esc(p.brand) + '</span>' +\n          '<span class=\"chip code\">' + esc(p.code) + '</span>' +\n          '<span class=\"chip\">' + esc(p.catLabel || p.cat || '—') + '</span>' +\n          (p.salla ? '<span class=\"chip salla\">سلة ' + esc(p.salla) + '</span>' : '<span class=\"chip new\">غير مُدرج في المتجر</span>') +\n          (p.pending ? '<span class=\"chip pending\">بانتظار فحص المصادر</span>' : '') +\n          '</div></div>' +\n        '<div class=\"pm\"><span>' + cols.length + ' لون</span><span>' + sizes + ' مقاس</span>' +\n          (lo.length ? '<b>' + Math.min.apply(null, lo) + ' ر.س</b>' : '<b class=\"warn\">—</b>') +\n          '<span class=\"caret\">' + (isOpen ? '▲' : '▼') + '</span></div>' +\n      '</div>' +\n      (isOpen ? '<div class=\"pb\">' + (cols.length ? cols.map(function (c) { return colorBlock(p, c); }).join('')\n        : '<p class=\"none\">لا ألوان مسجّلة بعد.</p>') +\n        (p.shopUrl ? '<p class=\"plinks\"><a href=\"' + esc(p.shopUrl) + '\" target=\"_blank\" rel=\"noopener\">صفحة المنتج في المتجر ↗</a>' +\n          '<a href=\"' + esc(p.adminUrl) + '\" target=\"_blank\" rel=\"noopener\">تحريره في لوحة سلة ↗</a></p>' : '') +\n        (p.note ? '<p class=\"note2\">' + esc(p.note) + '</p>' : '') + '</div>' : '') +\n    '</article>';\n  }\n\n  function fbtn(g, v, label) {\n    return '<button class=\"filt' + (F[g] === v ? ' on' : '') + '\" data-g=\"' + g + '\" data-v=\"' + esc(v) + '\">' + esc(label) + '</button>';\n  }\n\n  function listView() {\n    var vis = visible();\n    var brands = [].concat.apply([], all().map(function (p) { return p.brand; }))\n      .filter(function (v, i, a) { return a.indexOf(v) === i; });\n    var cats = all().map(function (p) { return p.cat; }).filter(function (v, i, a) { return v && a.indexOf(v) === i; });\n    var totalColors = all().reduce(function (a, p) { return a + (p.colors || []).length; }, 0);\n    var totalSizes = all().reduce(function (a, p) {\n      return a + (p.colors || []).reduce(function (b, c) { return b + ((c.perSize || []).length); }, 0); }, 0);\n    return '<div class=\"sum\">' +\n        '<div><b>' + all().length + '</b><span>منتجاً</span></div>' +\n        '<div><b>' + totalColors + '</b><span>لوناً</span></div>' +\n        '<div><b>' + totalSizes + '</b><span>مقاساً بمصدر</span></div>' +\n        '<div><b>' + okSizes() + '</b><span>منها بسعر مقبول</span></div>' +\n        '<div><b>' + all().filter(function (p) { return p.salla; }).length + '</b><span>مُدرجاً في سلة</span></div>' +\n        '<div><b>' + srcCount() + '</b><span>مصدراً مختلفاً</span></div>' +\n      '</div>' +\n      '<div class=\"filters\"><input id=\"q\" class=\"q\" placeholder=\"ابحث باسم أو كود أو رقم سلة\" value=\"' + esc(F.q) + '\">' +\n        '<span class=\"lbl\">العلامة</span>' + fbtn('brand', 'all', 'الكل') +\n        brands.map(function (b) { return fbtn('brand', b, b); }).join('') +\n        '<span class=\"lbl\">الفئة</span>' + fbtn('cat', 'all', 'الكل') +\n        cats.map(function (c) { return fbtn('cat', c, DATA.catLabels[c] || c); }).join('') +\n        '<span class=\"lbl\">المصدر</span>' + fbtn('src', 'all', 'الكل') +\n        ['rakuten', 'amazon', 'himaraya', 'gallery2', 'brand'].map(function (k) {\n          return fbtn('src', k, DATA.srcLabels[k]); }).join('') +\n      '</div>' +\n      '<div class=\"legend\"><b>كيف تقرأ الجداول</b>' +\n        '<span><i class=\"lg in\"></i> مقاس <b>بسعر مقبول</b> — سعره لا يزيد ٢٥٪ عن أرخص مقاس في هذا اللون. <b>كل المقاسات مشمولة</b> ما دام سعرها في النطاق، صغيرةً كانت أو كبيرة</span>' +\n        '<span><i class=\"lg over\"></i> مقاس <b>سعره شاذّ</b> — أغلى من النطاق، والنسبة مكتوبة في الخانة. غالباً بائع هامشي لا يستحق</span>' +\n        '<span><i class=\"lg tagr\"></i> السعر من <b>راكوتين</b> — متجر ياباني موثّق</span>' +\n        '<span><i class=\"lg taga\"></i> السعر من <b>أمازون اليابان</b> — كل ASIN مقاس واحد</span>' +\n        '<span><i class=\"lg ml\"></i> <b>مصدر على مستوى الموديل</b>: المتجر لا يذكر رمز اللون، فالسعر مؤكَّد للموديل ويحتاج تأكيد اللون عند الطلب</span>' +\n      '</div>' +\n      '<div class=\"list\">' + (vis.length ? vis.map(productCard).join('') : '<p class=\"none\">لا منتج يطابق البحث.</p>') + '</div>';\n  }\n\n  function field(k, label, type, ph) {\n    return '<label class=\"f\"><span>' + esc(label) + '</span>' +\n      (type === 'area'\n        ? '<textarea data-f=\"' + k + '\" rows=\"3\" placeholder=\"' + esc(ph || '') + '\">' + esc(form[k]) + '</textarea>'\n        : '<input data-f=\"' + k + '\" value=\"' + esc(form[k]) + '\" placeholder=\"' + esc(ph || '') + '\">') + '</label>';\n  }\n\n  function addView() {\n    return '<div class=\"addwrap\"><h2>إضافة منتج</h2>' +\n      '<p class=\"hint\">ألصق <b>رابط المنتج</b> من أي متجر ياباني (راكوتين · أمازون · هيمارايا · موقع العلامة) — أو اكتب <b>كوده</b> أو <b>اسمه</b>. ' +\n      'يُحفظ فوراً ويظهر في القائمة موسوماً <b>«بانتظار فحص المصادر»</b>، ثم أبحث عنه في كل المصادر وأملأ ألوانه ومقاساته و<b>أرخص مصدر لكل مقاس</b>.</p>' +\n      field('input', 'الرابط أو الكود أو الاسم', 'area', 'https://item.rakuten.co.jp/…\\nأو 1103A127\\nأو: أسيكس دي إس لايت برو AG') +\n      '<details class=\"more\"><summary>تفاصيل اختيارية — تسرّع الفحص</summary><div class=\"grid2\">' +\n        field('brand', 'العلامة', 'text', 'Asics · Mizuno · Nike') +\n        field('colors', 'ألوان بعينها', 'text', '100 101 102') +\n        field('salla', 'رقم المنتج في سلة', 'text', 'إن كان مُدرجاً أصلاً') +\n        field('note', 'ملاحظات', 'text', 'أي شيء يجب تذكّره') +\n      '</div></details>' +\n      '<div class=\"acts\"><button id=\"clr\">تفريغ</button>' +\n      '<button id=\"add\" class=\"go\"' + (saving ? ' disabled' : '') + '>' + (saving ? 'يُحفظ…' : 'أضف واحفظ') + '</button></div>' +\n      (msg ? '<p class=\"note ' + msg.k + '\">' + esc(msg.t) + '</p>' : '') +\n      (ADDED.length ? '<h3 class=\"addedh\">بانتظار الفحص (' + ADDED.length + ')</h3><ul class=\"addedl\">' +\n        ADDED.map(function (p) {\n          return '<li><b>' + esc(p.code || '—') + '</b> · ' + esc(p.name || p.raw || '—') + (p.brand !== '—' ? ' · ' + esc(p.brand) : '') + '</li>';\n        }).join('') + '</ul>' +\n        '<p class=\"hint\">أرسل لي «<b>افحص الجديد</b>» فأقرأ هذه القائمة وأفحصها.</p>' : '') +\n    '</div>';\n  }\n\n  function render() {\n    root.innerHTML = '<div class=\"wrap\"><header><h1>لوحة منتجات اليابان</h1>' +\n      '<nav><button class=\"tab' + (view === 'list' ? ' on' : '') + '\" data-v=\"list\">المنتجات</button>' +\n      '<button class=\"tab' + (view === 'add' ? ' on' : '') + '\" data-v=\"add\">إضافة منتج</button></nav>' +\n      '<a class=\"storelink\" href=\"' + esc(DATA.store.url) + '\" target=\"_blank\" rel=\"noopener\">' + esc(DATA.store.name) + ' ↗</a></header>' +\n      '<p class=\"lede\">كل ما يُورَّد من اليابان: المنتج ← ألوانه ← مقاساته، ولكل مقاس <b>أرخص متجر موثّق يحمله</b> برابطه. ' +\n      'التكلفة = ¥ × 0.0231 + ١٢٠ شحن + ١٥٪ ضريبة، لكل زوج. الأخضر = سعره ضمن نطاق المنتج، والبرتقالي = سعره شاذّ.</p>' +\n      (view === 'list' ? listView() : addView()) + '</div>';\n    var q = document.getElementById('q');\n    if (q) { q.oninput = function () { F.q = q.value; var s = q.selectionStart; render();\n      var n = document.getElementById('q'); if (n) { n.focus(); n.setSelectionRange(s, s); } }; }\n  }\n\n  root.addEventListener('input', function (e) {\n    var f = e.target.dataset && e.target.dataset.f;\n    if (f) form[f] = e.target.value;\n  });\n\n  root.addEventListener('click', function (e) {\n    var t = e.target;\n    var tab = t.closest && t.closest('.tab');\n    if (tab) { view = tab.dataset.v; msg = null; render(); return; }\n    var ph = t.closest && t.closest('.ph');\n    if (ph) { var id = ph.dataset.open; open[id] = !open[id]; render(); return; }\n    var b = t.closest && t.closest('button');\n    if (!b) return;\n    if (b.classList.contains('filt')) { F[b.dataset.g] = b.dataset.v; render(); return; }\n    if (b.id === 'clr') { form = { input: '', brand: '', colors: '', salla: '', note: '' }; msg = null; render(); return; }\n    if (b.id === 'add') { addProduct(); }\n  });\n\n  // كود الموديل قد يأتي داخل رابط (item.rakuten.co.jp/shop/1103a127-100) أو وحده أو داخل جملة\n  function pickCode(t) {\n    var m = String(t).toUpperCase().match(/\\b([A-Z]{1,3}\\d{4,6}[A-Z]?\\d{0,3}|\\d{4}[A-Z]\\d{3})\\b/);\n    return m ? m[1] : '';\n  }\n\n  function addProduct() {\n    var raw = (form.input || '').trim();\n    if (!raw) { msg = { k: 'err', t: 'ألصق رابطاً أو اكتب كوداً أو اسماً — أي واحد منها يكفي.' }; render(); return; }\n    var code = pickCode(raw);\n    var isUrl = /^https?:\\/\\//i.test(raw);\n    var cols = (form.colors || '').split(/[\\s,،]+/).filter(Boolean);\n    var p = {\n      id: 'new-' + (code || 'x') + '-' + ADDED.length,\n      raw: raw,\n      url: isUrl ? raw.split(/\\s+/)[0] : null,\n      brand: (form.brand || '').trim() || '—',\n      code: code,\n      name: isUrl ? (code || 'من رابط') : (code && raw.replace(code, '').trim() ? raw.replace(code, '').trim() : raw),\n      cat: 'shoes',\n      salla: (form.salla || '').trim(),\n      note: (form.note || '').trim(),\n      pending: true,\n      colors: (cols.length ? cols : ['—']).map(function (c) { return { col: c, store: null, perSize: [], level: [], shops: [] }; }),\n    };\n    ADDED.push(p);\n    save();\n  }\n\n  function buildDoc() {\n    var head = '<title>لوحة منتجات اليابان</title>' +\n      '<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">' +\n      '<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>' +\n      '<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap\">' +\n      '<style id=\"sty\">' + document.getElementById('sty').textContent + '</style>';\n    return '<!doctype html><html lang=\"ar\" dir=\"rtl\"><head><meta charset=\"utf-8\">' +\n      '<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">' + head + '</head><body>' +\n      '<div id=\"root\"></div>' +\n      '<script id=\"data\" type=\"application/json\">' + document.getElementById('data').textContent + '<\\/script>' +\n      '<script id=\"added\" type=\"application/json\">' + JSON.stringify(ADDED).replace(/<\\/script>/gi, '<\\\\/script>') + '<\\/script>' +\n      '<script id=\"app\">' + document.getElementById('app').textContent + '<\\/script></body></html>';\n  }\n\n  function save() {\n    try {\n      localStorage.setItem('rs_added', JSON.stringify(ADDED));\n      msg = { k: 'ok', t: 'حُفظ على هذا الجهاز. أرسل لكلود «افحص الجديد» ليملأ مصادره.' };\n      form = { input: '', brand: form.brand, colors: '', salla: '', note: '' };\n    } catch (e) { msg = { k: 'err', t: 'تعذّر الحفظ محلياً — تحقّق من مساحة المتصفّح.' }; }\n    render();\n  }\n\n  render();\n  if (window.claude && window.claude.use) {\n    window.claude.use('artifact').then(function (a) { artifact = a; }).catch(function () {});\n  }\n})();\n";</script>
